<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2fc"><title>我的每日待办</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#f7f3fc;color:#29233a;margin:0}main{max-width:680px;margin:auto;padding:24px 16px 60px}h1{font-size:30px;margin:10px 0}h2{font-size:20px;margin:0 0 16px}.sub{color:#756a86}.card{background:white;border-radius:24px;padding:22px;margin:16px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:10px;border-radius:20px;background:#eee7f7;overflow:hidden;margin:18px 0 0}.fill{height:100%;width:0;background:#8060bc;transition:width .2s}.task{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #eee;padding:14px 0}.task:last-child{border:0}.task input{width:23px;height:23px;accent-color:#8060bc;flex-shrink:0}.task strong{display:block;font-size:16px}.task small{display:block;color:#776f81;margin-top:5px;line-height:1.5}.task:has(input:checked) strong{text-decoration:line-through;color:#999}.pill{font-size:12px;border-radius:20px;background:#eee7f8;padding:5px 10px;color:#6246a0}input[type=date],input[type=text],select{box-sizing:border-box;font-size:16px;border:1px solid #dcd0e9;border-radius:12px;background:white;padding:12px;min-width:0;max-width:100%}button{border:0;background:#8060bc;color:white;border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer}button.secondary{background:#eee7f8;color:#6246a0}button.del{background:none;color:#8a7e96;padding:8px;min-width:40px}.stack{display:grid;gap:10px}.muted{font-size:13px;color:#746b7f;line-height:1.6}.flex{display:flex;gap:8px;flex-wrap:wrap}.grow{flex:1;min-width:140px}</style></head><body><main><div class="row"><div><div class="sub">🌷 每天一点点，也是在前进</div><h1>我的每日待办</h1></div><div style="text-align:right"><strong id="count" style="font-size:27px;color:#7655b0">0/5</strong><div class="sub">已完成</div></div></div><section class="card"><div class="row"><label for="date">查看日期</label><button type="button" class="secondary" id="today">回到今天</button></div><input id="date" type="date" style="width:100%;margin-top:12px"><div class="progress"><div id="bar" class="fill"></div></div></section><section class="card"><h2>📌 当日执行清单</h2><div id="tasks"><label class="task"><input type="checkbox"><span><strong>找尚老师签字盖章</strong><small>就业推荐表盖章申请表、就业信息表</small></span></label><label class="task"><input type="checkbox"><span><strong>🎓 EMA毕业论文</strong><small>梳理数据整理进度，明确下一步分析任务</small></span></label><label class="task"><input type="checkbox"><span><strong>📚 教师编制准备</strong><small>了解高中心理教师编制备考模块</small></span></label><label class="task"><input type="checkbox"><span><strong>18:20 出发去跳舞</strong><small>准备随身物品，预留往返时间</small></span></label><label class="task"><input type="checkbox"><span><strong>19:00–20:30 跳舞课 💃</strong><small>结束后返校休息</small></span></label></div></section><section class="card"><h2>🌱 长期主线</h2><div class="stack"><div><b>🎓 毕业论文</b><div class="muted">EMA数据质量检查 → 统计分析 → 论文写作</div></div><div><b>📚 教师编制</b><div class="muted">珠三角公办高中心理教师招聘 → 考纲 → 真题训练</div></div><div><b>🇬🇧 英语学习</b><div class="muted">暂缓固定训练；恢复后少量口语句型与主动输出</div></div></div></section><section class="card"><h2>➕ 新增任务</h2><form id="form" class="stack"><input id="name" type="text" maxlength="120" placeholder="写下要完成的事…" required><select id="category"><option value="today">当前日期</option><option value="future">近期提醒</option></select><button type="submit">添加任务</button></form></section><section class="card"><h2>🗓️ 近期提醒</h2><div id="upcoming"><label class="task"><input type="checkbox"><span><strong>11月20日（周五）· 和师妹吃饭</strong><small>具体时间待定</small></span></label></div></section><section class="card"><h2>💾 数据备份</h2><div class="flex"><button type="button" id="export">导出备份</button><label class="secondary" style="display:inline-block;background:#eee7f8;color:#6246a0;padding:12px 16px;border-radius:12px;cursor:pointer">导入备份<input type="file" id="import" accept="application/json" hidden></label></div><p class="muted">数据保存在当前浏览器内。更换浏览器、清理网站数据或使用不同网址可能导致记录无法读取，请定期导出备份。此页面不会自动同步聊天中的任务。</p><div id="status" class="muted" role="status"></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const key='daily-tasks-v3';const initial=[{id:'seal',name:'找尚老师签字盖章',note:'就业推荐表盖章申请表、就业信息表',done:false},{id:'ema',name:'🎓 EMA毕业论文',note:'梳理数据整理进度，明确下一步分析任务',done:false},{id:'teacher',name:'📚 教师编制准备',note:'了解高中心理教师编制备考模块',done:false},{id:'depart',name:'18:20 出发去跳舞',note:'准备随身物品，预留往返时间',done:false},{id:'dance',name:'19:00–20:30 跳舞课 💃',note:'结束后返校休息',done:false}];let state={days:{'2026-11-18':initial},upcoming:[{id:'fri',name:'11月20日（周五）· 和师妹吃饭',note:'具体时间待定',done:false}]};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.days&&saved.upcoming)state=saved}catch(e){$('status').textContent='无法读取之前的保存记录，当前显示初始清单。'}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}const date=$('date');date.value=today();function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){$('status').textContent='当前浏览器无法保存数据，请使用导出备份。'}}function item(t,group){const label=document.createElement('label');label.className='task';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.addEventListener('change',()=>{t.done=cb.checked;persist();render()});const text=document.createElement('span');text.style.flex='1';const title=document.createElement('strong');title.textContent=t.name;const note=document.createElement('small');note.textContent=t.note||'';text.append(title,note);const del=document.createElement('button');del.type='button';del.className='del';del.textContent='删除';del.setAttribute('aria-label','删除'+t.name);del.addEventListener('click',()=>{const list=group==='upcoming'?state.upcoming:state.days[date.value];const idx=list.indexOf(t);if(idx>=0)list.splice(idx,1);persist();render()});label.append(cb,text,del);return label}function render(){if(!/^\d{4}-\d{2}-\d{2}$/.test(date.value))date.value=today();const list=state.days[date.value]||[];const host=$('tasks');host.replaceChildren();list.forEach(t=>host.append(item(t,'day')));if(!list.length){const p=document.createElement('p');p.className='muted';p.textContent='这一天还没有任务，可以在下方添加。';host.append(p)}const done=list.filter(x=>x.done).length;$('count').textContent=done+'/'+list.length;$('bar').style.width=(list.length?done/list.length*100:0)+'%';const up=$('upcoming');up.replaceChildren();state.upcoming.forEach(t=>up.append(item(t,'upcoming')))}date.addEventListener('change',render);$('today').addEventListener('click',()=>{date.value=today();render()});$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;const task={id:String(Date.now())+Math.random().toString(36).slice(2),name,note:'',done:false};if($('category').value==='future')state.upcoming.push(task);else(state.days[date.value]??=[]).push(task);$('name').value='';persist();render()});$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='每日待办备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('import').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||typeof data.days!=='object'||!Array.isArray(data.upcoming))throw Error('格式不正确');for(const v of Object.values(data.days)){if(!Array.isArray(v)||v.length>2000||v.some(t=>typeof t.name!=='string'||t.name.length>500))throw Error('任务数据不正确')}if(data.upcoming.length>2000)throw Error('提醒过多');state=data;persist();render();$('status').textContent='备份导入成功'}catch(err){$('status').textContent='导入失败：'+err.message}e.target.value=''});render()})();</script></body></html>
